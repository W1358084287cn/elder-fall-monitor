; PlatformIO Project Configuration File
; 老人防摔系统 (Elder Fall Prevention System)
; Board: ESP32 Dev Module + GC9A01 240x240 + ADXL345 + MAX30102 + SFD01 + GPS

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000
board_build.f_flash = 80000000
board_build.flash_mode = qio

; 编译优化：-Os 减小固件体积，-O2 追求性能
build_type = release
build_unflags = 
build_flags = 
  -Os
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_MODE_QUAD

; 库依赖
lib_deps = 
  bodmer/TFT_eSPI@^2.5.43

; 上传配置
upload_speed = 921600

; 串口监视器过滤
monitor_filters = 
  esp32_exception_decoder
  time